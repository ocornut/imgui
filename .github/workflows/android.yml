#define _GNU_SOURCE
#include <stdio.h>
#include <stdlib.h>
#include <string.h>
#include <unistd.h>
#include <sys/ptrace.h>
#include <sys/wait.h>
#include <sys/user.h>
#include <dirent.h>
#include <dlfcn.h>
#include <sys/uio.h>
#include <elf.h>

// --- 强制定义 NDK 缺失的宏，防止编译器报错 ---
#ifndef NT_PRSTATUS
#define NT_PRSTATUS 1
#endif

#ifndef RTLD_DEFAULT
#define RTLD_DEFAULT ((void *) 0LL)
#endif

// 目标包名 (王者荣耀)
const char* TARGET_PKG = "com.tencent.tmgp.sgame"; 
// 注入路径 (确保 libJKMenu.so 已经用 adb push 到这里)
const char* LIB_PATH = "/data/local/tmp/libJKMenu.so";

pid_t find_pid_by_name(const char* package_name) {
    DIR* dir = opendir("/proc");
    if (!dir) return -1;
    struct dirent* entry;
    while ((entry = readdir(dir))) {
        pid_t pid = atoi(entry->d_name);
        if (pid <= 0) continue;
        char path[256], cmd[256];
        snprintf(path, sizeof(path), "/proc/%d/cmdline", pid);
        FILE* f = fopen(path, "r");
        if (f) {
            if (fgets(cmd, sizeof(cmd), f) && strstr(cmd, package_name)) {
                fclose(f); closedir(dir); return pid;
            }
            fclose(f);
        }
    }
    closedir(dir); return -1;
}

int main() {
    pid_t pid = find_pid_by_name(TARGET_PKG);
    if (pid == -1) { 
        printf("[-] Target process %s not found!\n", TARGET_PKG); 
        return 1; 
    }

    // 1. 附加到进程
    if (ptrace(PTRACE_ATTACH, pid, NULL, NULL) < 0) { 
        perror("[-] Attach failed"); 
        return 1; 
    }
    waitpid(pid, NULL, WUNTRACED);

    // 2. 获取寄存器 (ARM64)
    struct user_pt_regs regs;
    struct iovec iov;
    iov.iov_base = &regs;
    iov.iov_len = sizeof(regs);
    
    // 修正：将 NT_PRSTATUS 转换为 void* 以匹配 ptrace 签名
    if (ptrace(PTRACE_GETREGSET, pid, (void*)(uintptr_t)NT_PRSTATUS, &iov) < 0) {
        perror("[-] PTRACE_GETREGSET failed");
        ptrace(PTRACE_DETACH, pid, NULL, NULL);
        return 1;
    }

    // 3. 定位远程 dlopen
    uintptr_t remote_dlopen = (uintptr_t)dlsym(RTLD_DEFAULT, "__loader_dlopen"); 
    if (!remote_dlopen) {
        remote_dlopen = (uintptr_t)dlsym(RTLD_DEFAULT, "dlopen");
    }

    if (!remote_dlopen) {
        printf("[-] Failed to locate dlopen symbols.\n");
        ptrace(PTRACE_DETACH, pid, NULL, NULL);
        return 1;
    }

    // 4. 准备调用：将 SO 路径写入远程栈
    uintptr_t sp = (regs.sp - 512) & ~0xF; 
    size_t len = strlen(LIB_PATH) + 1;
    for (size_t i = 0; i < len; i += 8) {
        long data = 0;
        memcpy(&data, LIB_PATH + i, (len - i) < 8 ? (len - i) : 8);
        ptrace(PTRACE_POKETEXT, pid, sp + i, (void*)data);
    }

    // 5. 设置寄存器执行 dlopen(path, RTLD_NOW)
    regs.regs[0] = sp;  // x0: path
    regs.regs[1] = 2;   // x1: RTLD_NOW
    regs.pc = remote_dlopen;
    
    // 修正：将 NT_PRSTATUS 转换为 void* 以匹配 ptrace 签名
    ptrace(PTRACE_SETREGSET, pid, (void*)(uintptr_t)NT_PRSTATUS, &iov);

    // 6. 恢复并分离
    ptrace(PTRACE_DETACH, pid, NULL, NULL);

    printf("[+] Successfully sent injection request to PID %d\n", pid);
    return 0;
}
